<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ชวนไปเที่ยว</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;

    background-image:url("https://wallpaperaccess.com/full/3416589.jpg");
    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Tahoma,sans-serif;
}

.container{
    background:rgba(255,255,255,0.9);
    padding:40px;
    border-radius:25px;

    border:3px solid #ff91b7;

    box-shadow:0 10px 30px rgba(0,0,0,0.25);

    text-align:center;
    min-width:450px;
}

h1{
    color:#ff4f81;
    margin-bottom:30px;
}

button{
    padding:12px 25px;
    font-size:20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    margin:10px;
    font-weight:bold;
}

.yes-btn{
    background:#6ee7a7;
}

.no-btn{
    background:#ff9eb5;
    position:absolute;
}
</style>
</head>

<body>

<div class="container">
    <h1>🏝️ ไปเที่ยวทะเลกับพี่มั้ยน้อง? 🌊</h1>

    <p>⛴️ ไปเกาะกันเถอะ ☀️</p>

    <button class="yes-btn" onclick="acceptInvite()">
        ✅ ตกลง
    </button>

    <button id="noBtn" class="no-btn" onmouseover="moveButton()">
        ❌ ไม่ไป
    </button>
</div>

<script>

function acceptInvite(){
    document.querySelector(".container").innerHTML =
    `
    <h1>🎉 เย้! สะเด่าแน่ 🎉</h1>
    <h2>เตรียมเก็บกระเป๋าได้เลย 🏝️</h2>
    `;
}

function moveButton(){

    let btn = document.getElementById("noBtn");

    let x = Math.random() * (window.innerWidth - 150);
    let y = Math.random() * (window.innerHeight - 80);

    btn.style.left = x + "px";
    btn.style.top = y + "px";
}

</script>

</body>
</html>
